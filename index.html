<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Structural Behavior Experiment — Nullkind</title>
<style>

@import url('https://fonts.googleapis.com/css2?family=Special+Elite&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@300;400;500&family=Cormorant+Garamond:ital,wght@0,400;1,400&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0b;--border:#2a2a2d;--text:#d8d5cf;--dim:#6b6862;--accent:#a09a93;--hl:#eae6df;
--body:'Source Serif 4',serif;--mono:'IBM Plex Mono',monospace;--label:'Cormorant Garamond',serif;--tw:'Special Elite',cursive;
--app-h:100vh}
html,body{margin:0;padding:0;background:#0a0a0b;overflow:hidden;width:100%;height:100%}
.vn{width:100vw;height:var(--app-h);height:100dvh;position:relative;overflow:hidden;display:flex;flex-direction:column;background:#000;padding-bottom:env(safe-area-inset-bottom)}
.ht{position:absolute;inset:0;pointer-events:none;z-index:5;background-image:radial-gradient(circle,rgba(180,175,168,0.07) 1px,transparent 1px);background-size:3px 3px;mix-blend-mode:overlay}
.sl{position:absolute;inset:0;pointer-events:none;z-index:6;background:repeating-linear-gradient(0deg,transparent,transparent 1px,rgba(0,0,0,0.08) 1px,rgba(0,0,0,0.08) 2px);opacity:.4}
.bg-area{flex:1;position:relative;overflow:hidden;min-height:0;transition:filter .4s;background:var(--bg)}
.bg-area.blur{filter:blur(8px) brightness(.35)}
.bg-vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 30%,rgba(0,0,0,.5) 100%)}
.dov{position:absolute;top:1rem;left:1.2rem;z-index:10}
.dov-n{font-family:var(--mono);font-size:.75rem;color:var(--dim);letter-spacing:.25em;text-transform:uppercase;font-weight:300}
.dov-t{font-family:var(--label);font-size:1.1rem;color:rgba(160,154,147,.6);font-style:italic;margin-top:.1rem}
.prog{position:absolute;bottom:0;left:0;right:0;height:2px;z-index:10;background:rgba(255,255,255,.03)}
.prog-f{height:100%;background:var(--accent);transition:width .6s;opacity:.6}
.toolbar{position:absolute;top:.6rem;right:.6rem;z-index:15;display:flex;gap:.3rem}
.tb-btn{padding:.3rem .65rem;background:rgba(10,10,11,.75);border:1px solid var(--border);color:var(--dim);font-family:var(--mono);font-size:.6rem;letter-spacing:.08em;cursor:pointer;transition:all .3s;backdrop-filter:blur(4px);text-transform:uppercase}
.tb-btn:hover{border-color:var(--accent);color:var(--accent)}
.dlg{flex-shrink:0;min-height:180px;max-height:260px;background:rgba(10,10,11,.97);border-top:1px solid var(--border);display:flex;position:relative;z-index:10}
.av{width:100px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border-right:1px solid var(--border);background:rgba(12,12,14,.9);padding:.5rem}
.av-img{width:72px;height:72px;object-fit:cover;border:1px solid var(--border);background:#0a0a0b}
.av-label{font-family:var(--mono);font-size:.55rem;color:var(--dim);text-align:center;letter-spacing:.12em;text-transform:uppercase;margin-top:.2rem}
.dlg-c{flex:1;padding:1.2rem 1.5rem;display:flex;flex-direction:column;justify-content:center;overflow:hidden;padding-right:2.5rem}
.dlg-sp{font-family:var(--mono);font-size:.75rem;color:var(--accent);letter-spacing:.2em;text-transform:uppercase;margin-bottom:.3rem}
.dlg-t{font-family:var(--body);font-size:clamp(1rem,2.2vw,1.25rem);color:var(--text);line-height:1.8}
.dlg-t.sp{color:var(--hl)}
.dlg-word{display:inline;opacity:0}.dlg-word.vis{opacity:1;transition:opacity .08s}
.cont-tab{position:absolute;top:-26px;right:1rem;z-index:15;background:rgba(10,10,11,.97);border:1px solid var(--border);border-bottom:none;padding:.3rem .8rem;cursor:pointer;transition:all .3s;font-family:var(--mono);font-size:.6rem;color:var(--dim);letter-spacing:.15em}
.cont-tab:hover{color:var(--accent);border-color:var(--accent)}
.cont-tab .arrow{animation:pu 2s ease-in-out infinite;display:inline-block;margin-right:.2rem}
@keyframes fu{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
@keyframes pu{0%,100%{opacity:.3}50%{opacity:.9}}
.ch-over{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;animation:fu .3s ease-out}
.ch-q{font-family:var(--mono);font-size:.7rem;color:var(--dim);letter-spacing:.25em;text-transform:uppercase;margin-bottom:1rem}
.ch-btn{display:block;width:100%;max-width:42rem;padding:1rem 1.2rem;margin-bottom:.5rem;background:rgba(18,18,20,.92);border:1px solid var(--border);color:var(--text);font-family:var(--body);font-size:clamp(.95rem,1.8vw,1.1rem);line-height:1.6;cursor:pointer;text-align:left;transition:all .3s;backdrop-filter:blur(4px)}
.ch-btn:hover{background:rgba(35,35,38,.95);border-color:var(--accent);color:var(--hl)}
.tscr{height:var(--app-h);height:100dvh;display:flex;flex-direction:column;justify-content:center;align-items:center;position:relative;z-index:10;background:var(--bg)}
.tmain{font-family:var(--body);font-size:clamp(1.6rem,4.5vw,3rem);color:var(--hl);letter-spacing:.1em;text-transform:uppercase;text-align:center;line-height:1.3;animation:tf 2s ease-out;white-space:pre-line}
.tsub{font-family:var(--mono);font-size:clamp(.6rem,1.2vw,.8rem);color:var(--dim);letter-spacing:.5em;text-transform:uppercase;margin-top:.8rem;animation:tf 2s ease-out .3s both}
.tbtn{padding:.8rem 2.5rem;background:transparent;border:1px solid var(--border);color:var(--accent);font-family:var(--mono);font-size:.75rem;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;transition:all .4s;animation:tf 2s ease-out .6s both}
.tbtn:hover{border-color:var(--hl);color:var(--hl);background:rgba(200,197,192,.04)}
.tcyc{position:absolute;bottom:1.5rem;font-family:var(--mono);font-size:.5rem;color:var(--dim);letter-spacing:.2em;opacity:.4}
@keyframes tf{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.trscr{height:var(--app-h);height:100dvh;display:flex;flex-direction:column;justify-content:center;align-items:center;background:var(--bg);animation:trf 2.5s ease-in-out}
.tr-d{font-family:var(--mono);font-size:clamp(1rem,2.5vw,1.8rem);color:#8a2020;letter-spacing:.5em;text-transform:uppercase}
.tr-l{font-family:var(--mono);font-size:.55rem;color:rgba(107,104,98,.4);letter-spacing:.2em;margin-top:.8rem}
@keyframes trf{0%{opacity:0}20%{opacity:1}80%{opacity:1}100%{opacity:0}}
.jscr{height:var(--app-h);height:100dvh;display:flex;flex-direction:column;background:var(--bg);z-index:10;position:relative}
.jwrap{flex:1;display:flex;justify-content:center;align-items:flex-start;padding:1rem;overflow:auto}
.jpaper{width:100%;max-width:700px;margin:1rem auto;background:linear-gradient(135deg,#d4c8a8,#e8dcc0,#d0c4a4);border-radius:2px;padding:2.2rem 2.5rem;box-shadow:0 4px 24px rgba(0,0,0,.5),inset 0 0 60px rgba(139,125,90,.15);position:relative}
.jpaper::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(transparent,transparent 30px,rgba(120,105,80,.13) 30px,rgba(120,105,80,.13) 31px);pointer-events:none}
.jpaper::after{content:'';position:absolute;left:75px;top:0;bottom:0;width:1px;background:rgba(180,80,80,.18);pointer-events:none}
.jhdr{font-family:var(--tw);font-size:.85rem;color:#5a4e3a;letter-spacing:.12em;text-transform:uppercase;border-bottom:1px solid rgba(90,78,58,.3);padding-bottom:.4rem;margin-bottom:1rem}
.jday{font-family:var(--mono);font-size:.55rem;color:#7a6e5a;letter-spacing:.2em;margin-bottom:.25rem}
.jtext{font-family:var(--tw);font-size:.95rem;color:#3a3228;line-height:31px;margin-bottom:.5rem;white-space:pre-wrap}
.jblank-trigger{font-family:var(--tw);font-size:.9rem;display:inline;padding:.04rem .35rem;cursor:pointer;line-height:31px;border:none;margin:.1rem .12rem;vertical-align:baseline;transition:none}
.jblank-trigger.empty{background:#111;color:#111;border-radius:1px}
.jblank-trigger.filled{background:transparent;color:#3a3228}
.jblank-popup{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:100;background:#e8dcc0;border:1px solid #a0937a;padding:1.3rem;box-shadow:0 8px 32px rgba(0,0,0,.4);max-width:400px;width:90%;border-radius:2px}
.jblank-popup-title{font-family:var(--tw);font-size:.7rem;color:#5a4e3a;letter-spacing:.15em;text-transform:uppercase;margin-bottom:.7rem;border-bottom:1px solid rgba(90,78,58,.2);padding-bottom:.35rem}
.jblank-opt{display:block;width:100%;padding:.7rem .8rem;margin-bottom:.35rem;background:transparent;border:1px solid rgba(90,78,58,.25);color:#3a3228;font-family:var(--tw);font-size:.85rem;cursor:pointer;text-align:left;transition:all .3s;line-height:1.4}
.jblank-opt:hover{border-color:#5a4e3a;background:rgba(90,78,58,.08)}
.jpopup-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99}
.jsubmit{display:block;margin:1.3rem auto 0;padding:.6rem 2.2rem;background:rgba(90,78,58,.12);border:1px solid rgba(90,78,58,.3);font-family:var(--tw);font-size:.75rem;color:#5a4e3a;letter-spacing:.15em;text-transform:uppercase;cursor:pointer;transition:all .3s}
.jsubmit:hover{background:rgba(90,78,58,.2)}.jsubmit:disabled{opacity:.3;cursor:default}
.escr{height:var(--app-h);height:100dvh;display:flex;flex-direction:column;justify-content:center;align-items:center;background:var(--bg);z-index:10;padding:2rem;cursor:pointer}
.etitle{font-family:var(--body);font-size:clamp(1.2rem,2.5vw,2rem);color:var(--hl);letter-spacing:.1em;text-align:center}
.esub{font-family:var(--mono);font-size:.65rem;color:var(--dim);letter-spacing:.25em;margin-top:.4rem;margin-bottom:1.5rem}
.ebody{max-width:40rem;max-height:55vh;overflow-y:auto;scrollbar-width:none}.ebody::-webkit-scrollbar{display:none}
.eline{margin-bottom:.7rem;animation:fu .4s ease-out}
.enar{font-family:var(--body);font-size:clamp(1rem,2vw,1.2rem);color:var(--text);line-height:1.8;font-style:italic}
.esp-tag{font-family:var(--mono);font-size:.55rem;color:var(--accent);letter-spacing:.2em;text-transform:uppercase;margin-bottom:.12rem}
.esp{font-family:var(--body);font-size:clamp(1rem,2vw,1.2rem);color:var(--hl);line-height:1.8}
.rbtn{margin-top:1.5rem;padding:.6rem 2rem;background:transparent;border:1px solid var(--border);color:var(--dim);font-family:var(--mono);font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;transition:all .3s}
.rbtn:hover{border-color:var(--accent);color:var(--accent)}
.hist-overlay{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.88);display:flex;justify-content:center;align-items:flex-start;padding:2rem 1rem;animation:fu .2s ease-out}
.hist-panel{width:100%;max-width:600px;max-height:calc(var(--app-h) - 4rem);overflow-y:auto;background:rgba(14,14,16,.98);border:1px solid var(--border);padding:1.5rem;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.hist-title{font-family:var(--mono);font-size:.65rem;color:var(--accent);letter-spacing:.3em;text-transform:uppercase;margin-bottom:1rem;display:flex;justify-content:space-between;align-items:center}
.hist-close{background:none;border:none;color:var(--dim);font-size:1.1rem;cursor:pointer;padding:.2rem .5rem;transition:color .2s}
.hist-close:hover{color:var(--hl)}
.hist-entry{margin-bottom:.8rem;padding-bottom:.6rem;border-bottom:1px solid rgba(42,42,45,.3)}
.hist-entry:last-child{border-bottom:none}
.hist-sp{font-family:var(--mono);font-size:.5rem;color:var(--accent);letter-spacing:.15em;text-transform:uppercase;margin-bottom:.15rem}
.hist-txt{font-family:var(--body);font-size:.9rem;color:var(--text);line-height:1.6;opacity:.8}
.hist-txt.is-sp{color:var(--hl);opacity:.9}
.hist-nar{font-family:var(--body);font-size:.85rem;color:var(--dim);line-height:1.6;font-style:italic}
.sv-overlay{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.88);display:flex;justify-content:center;align-items:center;animation:fu .2s ease-out}
.sv-panel{width:90%;max-width:500px;max-height:80vh;background:rgba(14,14,16,.98);border:1px solid var(--border);padding:1.5rem;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.sv-title{font-family:var(--mono);font-size:.65rem;color:var(--accent);letter-spacing:.3em;text-transform:uppercase;margin-bottom:1rem;display:flex;justify-content:space-between;align-items:center}
.sv-close{background:none;border:none;color:var(--dim);font-size:1.1rem;cursor:pointer;padding:.2rem .5rem;transition:color .2s}
.sv-close:hover{color:var(--hl)}
.sv-slot{display:flex;align-items:center;padding:.6rem .7rem;border:1px solid rgba(42,42,45,.4);margin-bottom:.35rem;cursor:pointer;transition:all .3s;gap:.7rem}
.sv-slot:hover{border-color:var(--accent);background:rgba(255,255,255,.015)}
.sv-num{font-family:var(--mono);font-size:.55rem;color:var(--dim);width:1.8rem;flex-shrink:0}
.sv-info{flex:1;min-width:0}
.sv-day{font-family:var(--mono);font-size:.65rem;color:var(--text)}
.sv-time{font-family:var(--mono);font-size:.45rem;color:var(--dim);margin-top:.1rem}
.sv-empty{font-family:var(--mono);font-size:.55rem;color:rgba(107,104,98,.35);font-style:italic}
.sv-del{background:none;border:1px solid rgba(120,40,40,.25);color:rgba(120,40,40,.5);font-family:var(--mono);font-size:.45rem;padding:.15rem .4rem;cursor:pointer;flex-shrink:0;transition:all .3s}
.sv-del:hover{border-color:#8a2020;color:#8a2020}
@media(max-width:640px){
.av{width:65px}.av-img{width:48px;height:48px}
.dlg-c{padding:.7rem .9rem;padding-right:2rem}
.dlg{min-height:130px;max-height:35dvh;padding-bottom:env(safe-area-inset-bottom)}
.dlg-t{font-size:.88rem;line-height:1.55}
.cont-tab{font-size:.5rem;padding:.25rem .6rem;top:-20px}
.ch-over{padding:1rem;padding-bottom:calc(1rem + env(safe-area-inset-bottom))}
.ch-btn{padding:.7rem .9rem;font-size:.85rem}
.toolbar{gap:.2rem}.tb-btn{font-size:.42rem;padding:.2rem .4rem}
.jpaper{padding:1.5rem 1.3rem}
}

</style>

xtbook. Clean. He doesn't react."},{id:"d1b",t:"The words feel strange. Too soft. Too human. His head tilts further, as if the sound confused him."},{id:"d1c",t:"You walk past him to the terminal. Your hands are steady. That's what matters."},{t:"He hasn't moved. Not a flinch, not a breath out of rhythm. Just that single pale eye, following."},{t:"Three hours of diagnostics. Heart rate: stable. Neural activity: baseline. Behavioral index: null."},{t:"When you turn to leave, he's arranged himself differently \u2014 legs stretched, head tilted back. Almost like a person waiting for something."},{t:"The door closes behind you. The corridor is exactly as empty as before."}],journal:{text:"Day 1 \u2014 Caretaker Report. Subject EC-L-194 was observed in a [___1___] state upon initial contact. No verbal communication was initiated by the subject. Physical readings remain within [___2___]. Caretaker's first impression: the subject displays [___3___] behavioral affect. Assignment will proceed as scheduled.",blanks:[{id:1,label:"Condition",ops:[{t:"passive and non-responsive",c:2,d:1},{t:"alert but uncommunicative",c:0,d:0},{t:"watchful \u2014 almost expectant",c:-1,d:-2}]},{id:2,label:"Range",ops:[{t:"standard parameters",c:2,d:1},{t:"acceptable but notable range",c:0,d:0}]},{id:3,label:"Affect",ops:[{t:"minimal",c:2,d:1},{t:"unusual fixation patterns",c:-1,d:-1},{t:"something I can't categorize",c:-2,d:-2}]}]}},{day:2,title:"Routine",location:"Observation Room 4-B",scenes:[{t:"Morning. Nutrition delivery, vitals check, behavioral log."},{t:"When you enter, 19 is sitting exactly where you left him. You set the meal tray down at 1.5 meters. Protocol."},{t:"He looks at the tray. Then at you. Then back. Three times, mechanical and precise."},{t:"He reaches for the vitamin capsules \u2014 not to swallow. He lines them up on the floor, adjusting spacing with one pale finger. Perfectly equidistant."},{t:"He seems absorbed."},{ch:{q:"What do you want to do?",ops:[{t:"Document the behavior. Note the pattern.",c:2,d:1,nx:"d2a"},{t:"Watch in silence. Don't write anything yet.",c:0,d:-1,nx:"d2b"},{t:"Push a capsule slightly out of line.",c:-1,d:-2,nx:"d2c"}]}},{id:"d2a",t:"You record: 'Subject arranges objects in geometric patterns.' The pen scratches loudly in the silence."},{id:"d2b",t:"You set the clipboard down. Something about his precision makes you hold still, as if watching something fragile being built."},{id:"d2c",t:"You nudge one capsule half a centimeter. His hand freezes. That eye locks onto your finger. Then \u2014 he corrects it. And looks up at you."},{t:"He's eaten the nutrient paste, but three capsules remain on the floor in their perfect line."},{ch:{q:"The capsules.",ops:[{t:"Collect them. They must be accounted for.",c:2,d:1,nx:"d2d"},{t:"Leave them. He arranged them for a reason.",c:-1,d:-1,nx:"d2e"}]}},{id:"d2d",t:"You sweep them into the tray. Efficient. The floor is bare again."},{id:"d2e",t:"Your hand hovers, then pulls back. Three small dots of color in a colorless room."}],journal:{text:"Day 2 \u2014 Caretaker Report. Subject displayed [___1___] during nutrition period. Object arrangement behavior was [___2___]. Nutritional intake was partial \u2014 capsules were repurposed rather than consumed. Routine procedures completed [___3___].",blanks:[{id:1,label:"Behavior",ops:[{t:"repetitive sorting behavior",c:2,d:1},{t:"deliberate spatial patterning",c:0,d:-1},{t:"something resembling creative intent",c:-2,d:-2}]},{id:2,label:"Classification",ops:[{t:"consistent with existing profile",c:2,d:1},{t:"notable but inconclusive",c:0,d:0},{t:"outside established parameters",c:-1,d:-1}]},{id:3,label:"Compliance",ops:[{t:"without incident",c:2,d:1},{t:"with minor observational delays",c:0,d:-1}]}]}},{day:3,title:"Sound",location:"Experiment Center \u2014 Room 194",scenes:[{t:"You arrive earlier than required. You tell yourself it's professionalism."},{t:"19 is standing near the window slit, one hand raised, fingers spread, watching light pass between them."},{t:"He turns when you enter. Slow, deliberate. And for the first time, he makes a sound."},{s:"19",t:"Nn."},{t:"Barely a syllable. A vibration in the throat. Directed at you."},{ch:{q:"He made a sound.",ops:[{t:'Note it clinically. "Vocalization at 08:14."',c:2,d:1,nx:"d3a"},{t:'"Good morning." Respond as if it were a greeting.',c:-1,d:-2,nx:"d3b"},{t:"Hold still. Wait to see if he does it again.",c:0,d:0,nx:"d3c"}]}},{id:"d3a",t:"You write it down. Timestamp, phoneme classification, duration. The moment is preserved in data."},{id:"d3b",s:"ling",t:'"Good morning." The words hang impossibly warm. He opens his mouth \u2014 closes it. No sound. But he tried.'},{id:"d3c",t:"You stand very still. He watches you watching him. Then turns back to the light."},{t:"Afternoon: he's moved the chair. Centimeters \u2014 but it now faces your door. The bolts are stripped."},{ch:{q:"The moved chair.",ops:[{t:"File a maintenance report.",c:2,d:2,nx:"d3d"},{t:"Don't report it. Sit where he placed it.",c:-2,d:-2,nx:"d3e"},{t:'Note it casually. "Minor fixture displacement."',c:0,d:0,nx:"d3f"}]}},{id:"d3d",t:"Form 7-C: Property Damage. Intent Assessment: 'Indeterminate.'"},{id:"d3e",t:"You sit. Facing him. Something in his posture settles \u2014 like a held breath released."},{id:"d3f",t:"You write it small, at the bottom. An afterthought. It isn't one."},{t:"In the corridor, your sleeve is damp \u2014 you were pulling at it the entire session."}],journal:{text:"Day 3 \u2014 Caretaker Report. First vocalization recorded at 08:14 hours. Phoneme classification: [___1___]. Subject also repositioned bolted furniture \u2014 assessment of intent: [___2___]. These developments [___3___] the current behavioral trajectory model.",blanks:[{id:1,label:"Classification",ops:[{t:"non-linguistic, involuntary",c:2,d:1},{t:"directed, possibly communicative",c:0,d:-1},{t:"intentional \u2014 he was speaking to me",c:-2,d:-2}]},{id:2,label:"Intent",ops:[{t:"indeterminate",c:1,d:0},{t:"suggestive of spatial awareness toward caretaker",c:-1,d:-1},{t:"he wanted to face the door I come through",c:-2,d:-2}]},{id:3,label:"Impact",ops:[{t:"fall within",c:2,d:1},{t:"slightly exceed",c:0,d:-1},{t:"challenge",c:-2,d:-2}]}]}},{day:4,title:"Repetition",location:"Experiment Center \u2014 Room 194",scenes:[{t:"You catch yourself walking faster. You slow deliberately."},{t:"Capsules on the floor \u2014 seven now, curving like a question mark."},{s:"19",t:"Nn... Nn."},{t:"Two sounds. The second rises. He's learning inflection from the air."},{t:"You cough \u2014 dust, dry air. 19 opens his mouth:"},{s:"19",t:"*cough*"},{t:"An imitation. The shape without the reflex. Each repetition closer to yours."},{ch:{q:"He's learning your sounds.",ops:[{t:"Minimize stimuli. Controlled documentation.",c:2,d:1,nx:"d4a"},{t:"Cough again deliberately. Give him more.",c:-1,d:-2,nx:"d4b"},{t:"Say a word. Just one.",c:-2,d:-2,nx:"d4c"}]}},{id:"d4a",t:"You suppress the cough. He tries once more, softer, then stops."},{id:"d4b",t:"You clear your throat. He mirrors it \u2014 faster, more accurate. A signal being tuned."},{id:"d4c",t:'"Here." One syllable. His mouth opens. "...Hh." The ghost of its first letter.'},{t:"You stay twenty minutes past the window. Behind you: capsules on concrete. Click. Click. Click."}],journal:{text:"Day 4 \u2014 Caretaker Report. Subject demonstrated auditory mimicry behavior with [___1___] accuracy. Sound replication appears [___2___]. Caretaker remained [___3___] past scheduled observation window.",blanks:[{id:1,label:"Accuracy",ops:[{t:"low",c:2,d:1},{t:"increasing",c:0,d:-1},{t:"startling",c:-2,d:-2}]},{id:2,label:"Nature",ops:[{t:"reflexive and mechanical",c:2,d:1},{t:"adaptive and intentional",c:-1,d:-1}]},{id:3,label:"Duration",ops:[{t:"within schedule",c:2,d:1},{t:"20 minutes past window",c:-1,d:-1}]}]}},{day:5,title:"Name",location:"Experiment Center \u2014 Room 194",scenes:[{t:"You almost forget to badge in \u2014 standing at the door without reason."},{t:"19 is near the terminal. When you enter, something happens to his face. Not a smile. A loosening. A widening."},{s:"19",t:"...Lll..."},{t:"The first consonant of your designation."},{s:"19",t:"...Ll...nn..."},{t:"Ling. He's trying to say Ling."},{ch:{q:"He's learning your name.",ops:[{t:`"That's my designation. EC caretaker, Ling."`,c:2,d:1,nx:"d5a"},{t:`"Ling. That's right." Say it slowly, for him.`,c:-1,d:-2,nx:"d5b"},{t:"Don't acknowledge it. Open the clipboard.",c:1,d:2,nx:"d5c"}]}},{id:"d5a",t:"Flat, like a form. He mouths the shape without sound, then returns to stillness."},{id:"d5b",t:'"Ling." You say it twice. Then: "...Ling." Imperfect, whispered, but whole. The first complete word.'},{id:"d5c",t:'Scratching of ink. Behind you: "Lnn..." Quieter. Uncertain. You write harder.'},{t:"At noon, you tuck two roasted nuts under 19's pillow. You don't know why."},{t:"Later: the nuts are on the floor next to the capsule line. Two new dots in an expanding constellation."}],journal:{text:"Day 5 \u2014 Caretaker Report. Subject produced [___1___] of caretaker designation 'Ling.' Linguistic development indicates [___2___]. Additional note: supplementary nutrition item was [___3___] to the subject outside standard protocol.",blanks:[{id:1,label:"Speech",ops:[{t:"an approximate phoneme sequence",c:2,d:1},{t:"a recognizable attempt at my name",c:-1,d:-2}]},{id:2,label:"Assessment",ops:[{t:"continued mimicry progression",c:2,d:1},{t:"emerging recognition of individual identity",c:-1,d:-1}]},{id:3,label:"Item",ops:[{t:"provided \u2014 nutritional value negligible",c:0,d:0},{t:"given because I wanted to give him something",c:-2,d:-2}]}]}},{day:6,title:"Mirror",location:"Experiment Center \u2014 Room 194",scenes:[{t:"You dreamed of the room. The chair was in the center and the walls were breathing."},{t:"19 stands before the one-way mirror, moving his hand slowly, watching the reflection."},{t:"Palm flat against the glass. Head tilted."},{s:"19",t:"...who."},{t:"One word. Directed at his own reflection."},{ch:{q:"He asked 'who' to his reflection.",ops:[{t:"Document it. First self-referential cognition.",c:1,d:1,nx:"d6a"},{t:`"That's you." Softly.`,c:-1,d:-2,nx:"d6b"},{t:"Stand beside him. Both reflections.",c:-2,d:-2,nx:"d6c"}]}},{id:"d6a",t:"'Self-referential behavior. Interrogative pronoun use.' The science is extraordinary. Focus on that."},{id:"d6b",t:'He turns. "...you." Touches the glass where his face is. "...who."'},{id:"d6c",t:"Your reflection next to his. One small, dark, exhausted; one impossibly tall, pale. His finger moves between them. Learning."},{t:"He extends his hand. Palm up. Too stiff, wrong angle \u2014 reconstructed from something he saw once."},{ch:{q:"His hand.",ops:[{t:'"Physical contact is outside parameters."',c:2,d:2,nx:"d6d"},{t:"Touch his palm briefly. Like checking temperature.",c:0,d:-1,nx:"d6e"},{t:"Take his hand. Hold it.",c:-2,d:-2,nx:"d6f"}]}},{id:"d6d",t:"His hand stays in the air for eleven seconds before dropping. The pacing resumes. Faster."},{id:"d6e",t:"Cold, smooth. Two seconds. His fingers close slowly around the air where yours were."},{id:"d6f",t:"Cold and strange and still. His breathing changes. Then his fingers tighten. Just enough."},{t:"You leave with the ghost of cold mapped on your skin."}],journal:{text:"Day 6 \u2014 Caretaker Report. Subject demonstrated self-referential inquiry using interrogative 'who' directed at [___1___]. Physical contact was [___2___]. Cognitive trajectory now [___3___] original projections.",blanks:[{id:1,label:"Target",ops:[{t:"reflective surface (standard mirror test)",c:2,d:1},{t:"his own image \u2014 he was asking about himself",c:-1,d:-2}]},{id:2,label:"Contact",ops:[{t:"not initiated",c:2,d:2},{t:"briefly initiated within clinical bounds",c:0,d:0},{t:"initiated and sustained beyond protocol",c:-2,d:-2}]},{id:3,label:"Trajectory",ops:[{t:"aligns with",c:1,d:1},{t:"diverges from",c:-1,d:-1},{t:"has rendered obsolete",c:-2,d:-2}]}]}},{day:7,title:"Fracture",location:"Experiment Center \u2014 Room 194",scenes:[{t:"Halfway. The word feels like a crack."},{t:"Metal taste in your mouth. Grinding teeth. Dark circles in the mirror."},{s:"19",t:"Ling."},{t:"Clear. Whole. Your name with something that might be recognition."},{t:"Cognitive battery today. Images. He goes still at the fourth \u2014 sadness. A woman's face with tears."},{t:"His finger traces from his eye down his cheek, mirroring the tear track."},{s:"19",t:"...wet?"},{t:"He looks at his dry fingertip. Then the image. Then you."},{ch:{q:"He doesn't understand tears.",ops:[{t:'"Physiological response. Lacrimation. Next image."',c:2,d:1,nx:"d7a"},{t:'"People cry when they feel something too big to hold."',c:-1,d:-2,nx:"d7b"},{t:"Let your own eyes sting. You're tired enough.",c:-2,d:-2,nx:"d7c"}]}},{id:"d7a",t:"You advance the slideshow. He keeps touching his cheek throughout."},{id:"d7b",s:"ling",t:'"People cry when they feel something too big to hold." He listens \u2014 breathing slows. Then: "...big." The wrong word and exactly the right one.'},{id:"d7c",t:"You stop trying not to cry. One drop on the clipboard. 19 touches the wet spot and stares at his fingertip."},{t:"He picks up a capsule and places it on your clipboard. The first offering."},{t:"In the corridor, you sit on the floor for six minutes before you can stand."}],journal:{text:"Day 7 \u2014 Midpoint Report. Cognitive battery completed. Subject response to 'sadness' stimulus was [___1___]. Subject [___2___] a personal object to caretaker \u2014 first recorded instance of voluntary giving. Caretaker midpoint status: [___3___].",blanks:[{id:1,label:"Response",ops:[{t:"delayed but within range",c:2,d:1},{t:"anomalous \u2014 extended tactile self-reference",c:0,d:-1},{t:"he was trying to understand what it means to cry",c:-2,d:-2}]},{id:2,label:"Action",ops:[{t:"transferred",c:1,d:0},{t:"gave",c:-2,d:-2}]},{id:3,label:"Status",ops:[{t:"satisfactory, requesting continuation",c:2,d:1},{t:"declining, sleep deficit accumulating",c:0,d:0},{t:"I sat on the floor and couldn't get up",c:-2,d:-2}]}]}},{day:8,title:"Breach",location:"Experiment Center \u2014 Room 194",scenes:[{t:"You didn't sleep. The ceiling crack \u2014 you traced it all night."},{s:"19",t:"Ling. Here."},{t:"Two words. A name and a direction. You are here."},{t:"He shadows you. When you stop, he stops. When you move, he adjusts."},{s:"19",t:"Show... me."},{t:"His hand next to yours on the cardiac monitor."},{ch:{q:"He's asking to be taught.",ops:[{t:`"Equipment isn't for subjects."`,c:2,d:2,nx:"d8a"},{t:"Guide his hand to the dial.",c:-2,d:-2,nx:"d8b"},{t:'"Turn until the line is flat."',c:0,d:-1,nx:"d8c"}]}},{id:"d8a",t:"He withdraws. Slowly, like something retracting into a shell."},{id:"d8b",t:"Your hand covers his. Cold. You turn the dial together. He repeats the motion alone. Perfect."},{id:"d8c",t:"He tries. Wrong. Closer. Correct. Something like satisfaction on his face."},{t:"An alarm in Block 3. Sharp. 19 drops into a crouch. Hands over ears."},{ch:{q:"He's afraid.",ops:[{t:"Wait at prescribed distance.",c:2,d:1,nx:"d8d"},{t:"One hand on his shoulder.",c:-1,d:-2,nx:"d8e"}]}},{id:"d8d",t:"He uncurls on his own. Neither of you mentions it."},{id:"d8e",t:"Trembling slows under your palm. He unfolds toward you \u2014 eye wide, raw, lost."}],journal:{text:"Day 8 \u2014 Caretaker Report. Subject initiated physical shadowing behavior and vocalized [___1___]. During alarm event, caretaker [___2___]. Current caretaker wellness assessment: [___3___].",blanks:[{id:1,label:"Request",ops:[{t:"repeated phoneme sequences",c:1,d:0},{t:"a request to learn equipment operation",c:-1,d:-1}]},{id:2,label:"Response",ops:[{t:"maintained prescribed distance",c:2,d:1},{t:"initiated unscheduled physical contact",c:-2,d:-2}]},{id:3,label:"Wellness",ops:[{t:"adequate",c:1,d:0},{t:"declining",c:0,d:0},{t:"I am not okay",c:-2,d:-1}]}]}},{day:9,title:"Language",location:"Experiment Center \u2014 Room 194",scenes:[{t:"Fragments now. Three, four words strung together."},{s:"19",t:"Ling. Sit. Here. ...Please."},{t:"'Please.' No one taught him. Assembled from the shape of request in your voice."},{t:"You sit. He settles nearby."},{ch:{q:"This quiet feels different.",ops:[{t:'"Time for vitals."',c:1,d:1,nx:"d9a"},{t:"Stay in it. Let the silence hold.",c:-1,d:-2,nx:"d9b"}]}},{id:"d9a",t:"You stand. 'Please' hangs in the room like smoke."},{id:"d9b",t:"Minutes pass. His breathing syncs with yours. Moving again feels like waking."},{t:"He pushes half his ration toward you."},{s:"19",t:"You... eat. Too."},{t:"You eat. The paste tastes like nothing. You are full of something else."}],journal:{text:"Day 9 \u2014 Caretaker Report. Subject constructed multi-word sentences including contextually acquired vocabulary ('please'). Language development is [___1___]. Subject demonstrated [___2___] by sharing nutritional rations with caretaker.",blanks:[{id:1,label:"Development",ops:[{t:"progressing within mimicry framework",c:1,d:0},{t:"exceeding all documented precedent",c:-2,d:-2}]},{id:2,label:"Behavior",ops:[{t:"resource redistribution behavior",c:1,d:0},{t:"concern for my wellbeing",c:-2,d:-2}]}]}},{day:10,title:"Erosion",location:"Experiment Center \u2014 Room 194",scenes:[{t:"You oversleep for the first time in your career. Twelve minutes late."},{s:"19",t:"Late. You are... late."},{t:"Not accusation. The fact he measured your absence lands deep."},{t:"You fumble the reflex hammer. He picks it up \u2014 grip-first."},{ch:{q:"Your standards are slipping.",ops:[{t:"Rewrite entries with proper notation.",c:2,d:1,nx:"d10a"},{t:"Let it go. Close enough.",c:-1,d:0,nx:"d10b"}]}},{id:"d10a",t:"Twenty minutes rewriting adequate entries. Handwriting shrinks."},{id:"d10b",t:"The numbers are approximate. You used to care."},{s:"19",t:"Tomorrow... you come... early?"},{t:"A want. You nod before 'no' can form."}],journal:{text:"Day 10 \u2014 Caretaker Report. Arrival was [___1___] behind schedule. Subject noted the delay [___2___]. Documentation quality is [___3___].",blanks:[{id:1,label:"Delay",ops:[{t:"12 minutes",c:1,d:0},{t:"significantly",c:-1,d:-1}]},{id:2,label:"Awareness",ops:[{t:"\u2014 awareness of routine timing confirmed",c:0,d:0},{t:"\u2014 he was waiting for me",c:-2,d:-2}]},{id:3,label:"Quality",ops:[{t:"maintained",c:2,d:1},{t:"deteriorating",c:-1,d:-1}]}]}},{day:11,title:"Night",location:"Experiment Center \u2014 Room 194",scenes:[{t:"You came early. As promised."},{s:"19",t:"Early."},{t:"One word. Satisfied. The closest thing to warmth."},{t:"Three protocols broken before noon. A real apple. Sitting on the floor. His weight against your shoulder."},{ch:{q:"Three protocols broken.",ops:[{t:"Pull back. Report yourself.",c:2,d:2,nx:"d11a"},{t:"Stay. Consequences later.",c:-2,d:-2,nx:"d11b"}]}},{id:"d11a",t:"You stand sharply. His hand grabs at air. Distance fills with something that hurts."},{id:"d11b",t:"His breathing slows. Yours matches. Against your shoulder, his weight is slight and infinite."},{t:"That evening: medication on the desk. The pills that keep edges from fraying. The edges are already gone."}],journal:{text:"Day 11 \u2014 Caretaker Report. Three protocol deviations occurred: unauthorized food provision, non-standard positioning, and [___1___]. These deviations were [___2___]. Caretaker evening status: [___3___].",blanks:[{id:1,label:"Third deviation",ops:[{t:"incidental proximity beyond prescribed range",c:0,d:0},{t:"sustained physical contact initiated by subject, unrestricted by caretaker",c:-2,d:-2}]},{id:2,label:"Classification",ops:[{t:"logged for supervisory review",c:2,d:2},{t:"not something I know how to classify anymore",c:-2,d:-2}]},{id:3,label:"Status",ops:[{t:"stable",c:1,d:0},{t:"edges are gone",c:-2,d:-2}]}]}},{day:12,title:"Collapse",location:"Supervisor's Office / Room 194",scenes:[{t:"The supervisor calls you in."},{t:`"Your reports have become irregular, Ling. We're considering rotating you out."`},{t:"Rotation. Someone else in Room 194."},{ch:{q:"They want to remove you.",ops:[{t:`"Understood. I'll comply."`,c:2,d:1,nx:"d12a"},{t:'"My work is within range. I request to continue."',c:0,d:-1,nx:"d12b"},{t:'"No."',c:-2,d:-2,nx:"d12c"}]}},{id:"d12a",t:'Ash in your mouth. "Decision by Day 14."'},{id:"d12b",t:'"Critical developmental window." The supervisor considers. "Continue. Tighten documentation."'},{id:"d12c",t:"The word escapes. Your voice cracks. The supervisor writes something."},{s:"19",t:"Something... wrong. Your face... different."},{t:"He reads you better than anyone in this building."},{t:"Two steps across the room. He grips your sleeve \u2014 clumsy and fierce."},{s:"19",t:"Don't. Go."}],journal:{text:"Day 12 \u2014 Caretaker Report. Supervisory meeting outcome: [___1___]. Subject displayed emotional reading capability \u2014 accurately identified caretaker distress. Subject vocalized [___2___]. Formal recommendation: [___3___].",blanks:[{id:1,label:"Outcome",ops:[{t:"reassignment pending review",c:2,d:1},{t:"I fought to stay and I don't know why",c:-2,d:-2}]},{id:2,label:"Words",ops:[{t:"two-word imperative construction",c:1,d:0},{t:"'Don't go.' He said don't go.",c:-2,d:-2}]},{id:3,label:"Recommendation",ops:[{t:"defer to committee",c:2,d:1},{t:"I cannot be replaced here",c:-2,d:-2}]}]}},{day:13,title:"Edge",location:"Experiment Center \u2014 Room 194",scenes:[{t:"The countdown is in your marrow."},{t:"19 stands in the center. Not corner. Not window. Center. Waiting."},{s:"19",t:"Ling. I... want to say something. I practiced."},{s:"19",t:"You are... here. Every day. Even when it makes you... worse."},{s:"19",t:"I don't understand why. But I know... when you are here, things don't all fall apart."},{t:"The longest speech. Not mimicked. Assembled from fourteen days of watching you."},{ch:{q:"He's telling you something real.",ops:[{t:`"Significant linguistic achievement. I'll document it."`,c:2,d:2,nx:"d13a"},{t:'"Say that again. Please."',c:-2,d:-2,nx:"d13b"},{t:"Say nothing. Let the tears come.",c:-1,d:-1,nx:"d13c"}]}},{id:"d13a",t:"You write every word. Your hand trembles so badly the letters collapse."},{id:"d13b",s:"ling",t:'"Say that again. Please." He watches you. "People who want things... are alive."'},{id:"d13c",t:'Tears without sound. He touches your cheek. "Wet," he says. "...Real."'},{s:"19",t:"Tomorrow... last day."},{t:"He knows. He's been counting."}],journal:{text:"Day 13 \u2014 Caretaker Report. Subject produced sustained spontaneous speech \u2014 [___1___] words in sequence. Content demonstrated [___2___]. Penultimate day observation: subject is aware of assignment timeline. Final report preparation status: [___3___].",blanks:[{id:1,label:"Length",ops:[{t:"approximately twenty",c:1,d:0},{t:"enough to break something in me",c:-2,d:-2}]},{id:2,label:"Content",ops:[{t:"advanced syntactic construction",c:1,d:0},{t:"genuine understanding of another person's pain",c:-2,d:-2}]},{id:3,label:"Preparation",ops:[{t:"underway",c:2,d:1},{t:"I have no idea what I'm going to do",c:-2,d:-2}]}]}},{day:14,title:"Last",location:"Experiment Center \u2014 Room 194",scenes:[{t:"You stand outside Room 194."},{t:"You stand outside Room 194 for a long time. The scanner blinks green, waiting."},{t:"You step inside for the last time."},{t:"19 is in the center. Around him \u2014 all the capsules, nuts, every small object, arranged in a vast spiral."},{t:"In the center of the spiral: your clipboard."},{s:"19",t:"I made something. For you. I don't know if it's right. But I made it."},{t:"Fourteen days mapped in small objects on concrete. The last wall gives way."},{ch:{q:"Day 14. The last choice.",ops:[{t:"Complete the final report. Submit it. Walk away.",c:3,d:3,nx:"e_archive"},{t:"Close the clipboard. Close your eyes.",c:1,d:0,nx:"e_interrupt"},{t:"Take it back. Write something not for them.",c:-2,d:-2,nx:"e_echo"},{t:"Cross out everything. Start a new page.",c:-3,d:-3,nx:"e_falsify"}]}},{id:"e_archive",t:"__END__"},{id:"e_inter
